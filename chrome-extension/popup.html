<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 300px;
    margin: 0;
    padding: 14px;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0b0d10;
    color: #f2f1ec;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  h1 .dot { color: #ff4d4d; }
  #title {
    font-size: 12px;
    color: #9a9d9f;
    margin-bottom: 10px;
    word-break: break-word;
    max-height: 40px;
    overflow: hidden;
  }
  button {
    width: 100%;
    padding: 9px 0;
    border: none;
    border-radius: 8px;
    background: #ff4d4d;
    color: #0b0d10;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled {
    background: #3a2626;
    color: #6b6f71;
    cursor: default;
  }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: #9a9d9f;
    white-space: pre-wrap;
  }
  #status.error { color: #ff5f57; }
  #status.done { color: #28c840; }
  progress {
    width: 100%;
    height: 6px;
    margin-top: 8px;
    accent-color: #ff4d4d;
  }
</style>
</head>
<body>
  <h1><span class="dot">&#9679;</span> YT Downloader</h1>
  <div id="title">Checking current tab&hellip;</div>
  <button id="downloadBtn" disabled>Download best quality</button>
  <progress id="bar" value="0" max="100" style="display:none"></progress>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
